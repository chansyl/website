name: Build and deploy company websites
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - name: Determine Pages address
        env:
          CONFIGURED_URL: ${{ vars.PAGES_URL }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$CONFIGURED_URL" ]; then
            echo "PAGES_URL=$CONFIGURED_URL" >> "$GITHUB_ENV"
          else
            repo_name="${REPO#*/}"
            owner_lower="${OWNER,,}"
            if [ "${repo_name,,}" = "$owner_lower.github.io" ]; then
              echo "PAGES_URL=https://$owner_lower.github.io" >> "$GITHUB_ENV"
            else
              echo "PAGES_URL=https://$owner_lower.github.io/$repo_name" >> "$GITHUB_ENV"
            fi
          fi
      - run: pnpm build && pnpm check:output
        env:
          ALLOW_INDEXING: ${{ vars.ALLOW_INDEXING || 'false' }}
      - name: Install verification browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify desktop and mobile journeys
        run: pnpm test:production
        env:
          BROWSER_CHANNEL: chromium
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy all enabled sites
        id: deployment
        uses: actions/deploy-pages@v4
